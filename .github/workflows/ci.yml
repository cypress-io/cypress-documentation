name: CI

# The build-and-test pipeline for every pull request and every commit on main:
# a production build, lint, typecheck, unit tests, the Cypress suite, and the
# Algolia reindex. This replaces the CircleCI `build-and-test` workflow that
# `.circleci/config.yml` used to define.
#
# The build is the safety net for content, not a formality: `onBrokenLinks` and
# `onBrokenMarkdownLinks` are `throw`, so a bad link or anchor fails here.

on:
  push:
    branches:
      - main
  pull_request:

# Read-only by default. No job here writes to the repository; each one that
# needs more asks for it itself.
permissions:
  contents: read

concurrency:
  # One in-flight run per pull request, superseding the last — the auto-cancel
  # CircleCI did on a re-push. Runs on main are never cancelled, so every commit
  # that lands keeps a result of its own.
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: 0

      - name: Build the site
        run: npm run build

      # The e2e job serves this build rather than repeating it, so one build
      # feeds all eight containers — what CircleCI's persisted workspace did.
      - name: Upload the production build
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 1

  lint:
    name: Lint JS/CSS/Markdown
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: 0

      - name: Lint
        run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: 0

      - name: Typecheck
        run: npm run typecheck

  unit-tests:
    name: Unit Tests (Search/Algolia, plugins)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: 0

      - name: Search / Algolia unit tests
        run: npm run test:search

      - name: Plugin unit tests
        run: npm run test:plugins

  e2e:
    name: E2E (${{ matrix.container }}/8)
    needs: build
    # Splitting the suite across containers is Cypress Cloud load balancing, so
    # it needs CYPRESS_RECORD_KEY — and GitHub withholds secrets from a pull
    # request opened from a fork. Those run `e2e-fork` below instead.
    if: github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # One container failing must not cancel the other seven: Cypress Cloud
      # keeps the run open until every container it is balancing has reported.
      fail-fast: false
      matrix:
        container: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Download the production build
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      # Installs dependencies, restores the cached Cypress binary, serves the
      # build downloaded above, and runs the suite. No `build` input: the build
      # job already produced what `npm run serve` serves.
      - name: Run Cypress
        uses: cypress-io/github-action@v7
        with:
          start: npm run serve
          wait-on: 'http://localhost:3000'
          record: true
          parallel: true
          group: 'Docs e2e'
        env:
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUSKY: 0

  e2e-fork:
    name: E2E (fork, not recorded)
    needs: build
    # The counterpart to `e2e`: a pull request from a fork has no record key, so
    # the suite runs unsplit in a single container and reports nothing to
    # Cypress Cloud. Slower, but it still gives an outside contributor a result.
    if: github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Download the production build
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Run Cypress
        uses: cypress-io/github-action@v7
        with:
          start: npm run serve
          wait-on: 'http://localhost:3000'
        env:
          HUSKY: 0

      # Screenshots are the only way to see what failed without a Cloud run.
      - name: Upload screenshots from failures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore
          retention-days: 7

  algolia:
    name: Run Algolia scraper
    needs: build
    # Reindexes the live docs.cypress.io, so it belongs to a commit that has
    # landed rather than to a pull request, and the Algolia write key is a
    # repository secret a fork does not have. `needs: build` keeps a broken
    # build from triggering a reindex.
    if: github.event_name == 'push' &&
      (github.ref == 'refs/heads/main') &&
      (github.repository == 'cypress-io/cypress-documentation')
    runs-on: ubuntu-latest
    # The scraper pulls a Docker image, crawls the whole site, and then waits
    # two minutes for Algolia to finish accepting the upload.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: 0

      # Docker is preinstalled on GitHub-hosted runners, so the scraper's
      # `docker run` needs no setup step of its own.
      - name: Scrape and compare the Algolia index
        run: node ./scripts/search/scrape-and-compare-algolia-index.mjs
        env:
          ALGOLIA_API_KEY: ${{ secrets.ALGOLIA_API_KEY }}
          ALGOLIA_APPLICATION_ID: ${{ secrets.ALGOLIA_APPLICATION_ID }}
