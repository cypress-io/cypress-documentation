<text class="label" x="132" y="211">Post 6</text>
<rect class="item" x="122" y="228" width="136" height="26" rx="3"/>
<text class="label" x="132" y="245">Post 7</text></g>
<rect class="head" x="110" y="108" width="160" height="16"/><text class="headtext" x="118" y="120">Sticky header</text></g>
<rect class="view" x="110" y="108" width="160" height="100"/>
<text class="note" x="110" y="242">2. Scrolled down one viewport</text>
<clipPath id="f1"><rect x="110" y="252" width="160" height="100"/></clipPath>
<g clip-path="url(#f1)"><g transform="translate(0 152)"><rect class="pagebg" x="110" y="0" width="160" height="260"/>
<rect class="item" x="122" y="24" width="136" height="26" rx="3"/>
