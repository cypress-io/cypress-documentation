<rect class="item" x="122" y="228" width="136" height="26" rx="3"/>
<text class="label" x="132" y="245">Post 7</text></g>
<rect class="head" x="110" y="252" width="160" height="16"/><text class="headtext" x="118" y="264">Sticky header</text></g>
<rect class="view" x="110" y="252" width="160" height="100"/>
<text class="note" x="110" y="386">3. Scrolled to the bottom</text>
<clipPath id="f2"><rect x="110" y="396" width="160" height="100"/></clipPath>
<g clip-path="url(#f2)"><g transform="translate(0 236)"><rect class="pagebg" x="110" y="0" width="160" height="260"/>
<rect class="item" x="122" y="24" width="136" height="26" rx="3"/>
<text class="label" x="132" y="41">Post 1</text>
<rect class="item" x="122" y="58" width="136" height="26" rx="3"/>
<text class="label" x="132" y="75">Post 2</text>
<rect class="item" x="122" y="92" width="136" height="26" rx="3"/>
<text class="label" x="132" y="109">Post 3</text>
