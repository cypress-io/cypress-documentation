<rect class="item" x="122" y="228" width="136" height="26" rx="3"/>
<text class="label" x="132" y="245">Post 7</text></g>
<rect class="pagebg" x="110" y="396" width="160" height="40"/>
<rect x="110" y="396" width="160" height="40" fill="url(#hatch)"/>
<rect class="head" x="110" y="396" width="160" height="16"/><text class="headtext" x="118" y="408">Sticky header</text></g>
<rect class="pill" x="140" y="414.0" width="100" height="20" rx="10"/>
<text class="label" x="190.0" y="428.0" text-anchor="middle">Cropped out</text>
<path class="arrow" d="M102 396 V436" /><path class="arrow" d="M98 396 H106 M98 436 H106"/>
<rect class="view" x="110" y="396" width="160" height="100"/>
<path class="arrow" d="M300 288 H446"/><path class="arrowhead" d="M456 288 l-12 -7 v14 z"/>
<clipPath id="st"><rect x="490" y="108" width="160" height="260"/></clipPath>
<g clip-path="url(#st)"><g transform="translate(0 108)"><rect class="pagebg" x="490" y="0" width="160" height="260"/>
<rect class="item" x="502" y="24" width="136" height="26" rx="3"/>
<text class="label" x="512" y="41">Post 1</text>
<rect class="item" x="502" y="58" width="136" height="26" rx="3"/>
