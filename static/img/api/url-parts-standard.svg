<text class="key" x="128.0" y="146" text-anchor="middle">protocol</text>
<path class="br" d="M 189.5 122 V 129 H 318.5 V 122"/>
<text class="key" x="254.0" y="146" text-anchor="middle">hostname</text>
<path class="br" d="M 333.5 122 V 129 H 378.5 V 122"/>
<text class="key" x="356.0" y="146" text-anchor="middle">port</text>
<path class="br" d="M 381.5 122 V 129 H 498.5 V 122"/>
<text class="key" x="440.0" y="146" text-anchor="middle">pathname</text>
<path class="br" d="M 501.5 122 V 129 H 570.5 V 122"/>
<text class="key" x="536.0" y="146" text-anchor="middle">search</text>
<path class="br" d="M 573.5 122 V 129 H 666.5 V 122"/>
<text class="key-hash" x="620.0" y="146" text-anchor="middle">hash</text>
