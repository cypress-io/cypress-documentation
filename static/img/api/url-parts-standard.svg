<svg xmlns="http://www.w3.org/2000/svg" width="608" height="220" viewBox="0 0 608 220" role="img" aria-labelledby="t d">
<title id="t">Parts of a standard URL</title>
<desc id="d">The URL https://example.com:8080/app/users?tab=1#section split into its parts: protocol is https:, hostname is example.com, port is 8080, host is example.com:8080, origin is https://example.com:8080, pathname is /app/users, search is ?tab=1, hash is #section, and href is the whole URL.</desc>
<style>
  .card { fill: #f7f8fc; stroke: #e1e3ed; }
  .u, .u-dim, .u-hash { font: 500 19px ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; }
  .u { fill: #1b1e2e; }
  .u-dim { fill: #676b82; }
  .u-hash { fill: #4956e3; }
  .hl { fill: #e9ebfc; }
  .br { fill: none; stroke: #6f74a0; stroke-width: 1.25; }
  .callout { fill: none; stroke: #555a6e; stroke-width: 1.25; }
  .key { font: 600 13px ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; fill: #1b1e2e; }
  .key-hash { font: 600 13px ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; fill: #4956e3; }
  .note { font: 13px -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #555a6e; }
</style>
<rect class="card" x="0.5" y="0.5" width="607" height="219" rx="12"/>
<text class="u" x="16" y="112" textLength="72" lengthAdjust="spacingAndGlyphs">https:</text>
<text class="u-dim" x="88" y="112" textLength="24" lengthAdjust="spacingAndGlyphs">//</text>
<text class="u" x="112" y="112" textLength="132" lengthAdjust="spacingAndGlyphs">example.com</text>
<text class="u-dim" x="244" y="112" textLength="12" lengthAdjust="spacingAndGlyphs">:</text>
<text class="u" x="256" y="112" textLength="48" lengthAdjust="spacingAndGlyphs">8080</text>
<text class="u" x="304" y="112" textLength="120" lengthAdjust="spacingAndGlyphs">/app/users</text>
<text class="u" x="424" y="112" textLength="72" lengthAdjust="spacingAndGlyphs">?tab=1</text>
<text class="u-hash" x="496" y="112" textLength="96" lengthAdjust="spacingAndGlyphs">#section</text>
<path class="br" d="M 113.5 90 V 83 H 302.5 V 90"/>
<text class="key" x="208.0" y="76" text-anchor="middle">host</text>
<path class="br" d="M 17.5 52 V 45 H 302.5 V 52"/>
<text class="key" x="160.0" y="38" text-anchor="middle">origin</text>
<path class="br" d="M 17.5 122 V 129 H 86.5 V 122"/>
<text class="key" x="52.0" y="146" text-anchor="middle">protocol</text>
<path class="br" d="M 113.5 122 V 129 H 242.5 V 122"/>
<text class="key" x="178.0" y="146" text-anchor="middle">hostname</text>
<path class="br" d="M 257.5 122 V 129 H 302.5 V 122"/>
<text class="key" x="280.0" y="146" text-anchor="middle">port</text>
<path class="br" d="M 305.5 122 V 129 H 422.5 V 122"/>
<text class="key" x="364.0" y="146" text-anchor="middle">pathname</text>
<path class="br" d="M 425.5 122 V 129 H 494.5 V 122"/>
<text class="key" x="460.0" y="146" text-anchor="middle">search</text>
<path class="br" d="M 497.5 122 V 129 H 590.5 V 122"/>
<text class="key-hash" x="544.0" y="146" text-anchor="middle">hash</text>
<path class="br" d="M 17.5 164 V 171 H 590.5 V 164"/>
<text class="key" x="304.0" y="188" text-anchor="middle">href</text>
</svg>
