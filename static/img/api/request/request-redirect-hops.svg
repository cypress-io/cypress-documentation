<svg xmlns="http://www.w3.org/2000/svg" width="720" height="528" viewBox="0 0 720 528" role="img" aria-labelledby="t d">
<title id="t">What cy.request() sends at each redirect</title>
<desc id="d">A POST to http://localhost:8080/login with your headers, an Authorization header, a Content-Type header, and a body returns 302 with a Set-Cookie header, which Cypress saves in the browser. Cypress follows it with a GET to http://localhost:8080/home that keeps your headers and Authorization, adds the saved cookie, and drops the body, Content-Type, and Content-Length. That returns 302 to https://api.example.com/me, a different hostname, so the next GET keeps your headers but drops Authorization too, and sends only cookies that match api.example.com. A 307 redirect keeps the method, body, and Content-Type.</desc>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#5A5F7A"/>
  </marker>
</defs>
<style>
  @font-face { font-family: Poppins; font-weight: 500; src: url(data:font/woff2;base64,) format('woff2'); } /* Poppins 500, subset to this diagram's title glyphs. SIL Open Font License 1.1 */
  /* Colors are @cypress-design/css tokens: gray, with indigo for arrow labels. */
  .card { fill: #F3F4FA; stroke: #E1E3ED; }
  .box { fill: #FFFFFF; stroke: #747994; stroke-width: 1.25; }
  .line { fill: none; stroke: #5A5F7A; stroke-width: 1.5; }
  .title { font: 500 15px Poppins, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; fill: #1B1E2E; }
  .req { font: 600 14px SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace; fill: #1B1E2E; }
  .k { font: 13px ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; fill: #5A5F7A; }
  .v { font: 14px ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; fill: #1B1E2E; }
  .lbl { font: 600 12.5px SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace; fill: #3A46CC; }
  .dim { font: italic 13px ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; fill: #5A5F7A; }
</style>
<rect class="card" x="0.5" y="0.5" width="719" height="527" rx="12"/>

<!-- Request 1 -->
<rect class="box" x="24" y="24" width="672" height="84" rx="8"/>
<text class="title" x="44" y="56">Request 1</text>
<text class="req" x="148" y="56">POST http://localhost:8080/login</text>
<text class="k" x="44" y="86">Sends</text>
<text class="v" x="148" y="86">your headers, Authorization, Content-Type, body</text>

<path class="line" d="M 68 110 V 158" marker-end="url(#arr)"/>
<text class="lbl" x="88" y="131">302 · Location: /home</text>
<text class="lbl" x="88" y="149">Set-Cookie: sid=…</text>
<text class="dim" x="696" y="140" text-anchor="end">Cypress saves sid in the browser</text>

<!-- Request 2 -->
<rect class="box" x="24" y="162" width="672" height="140" rx="8"/>
<text class="title" x="44" y="194">Request 2</text>
<text class="req" x="148" y="194">GET http://localhost:8080/home</text>
<text class="k" x="44" y="224">Sends</text>
<text class="v" x="148" y="224">your headers, Authorization, Cookie: sid=…</text>
<text class="k" x="44" y="252">Drops</text>
<text class="v" x="148" y="252">body, Content-Type, Content-Length</text>
<text class="dim" x="148" y="282">The method becomes GET. Only a 307 keeps the method, body, and Content-Type.</text>

<path class="line" d="M 68 304 V 352" marker-end="url(#arr)"/>
<text class="lbl" x="88" y="333">302 · Location: https://api.example.com/me</text>
<text class="dim" x="696" y="333" text-anchor="end">a different hostname</text>

<!-- Request 3 -->
<rect class="box" x="24" y="356" width="672" height="112" rx="8"/>
<text class="title" x="44" y="388">Request 3</text>
<text class="req" x="148" y="388">GET https://api.example.com/me</text>
<text class="k" x="44" y="418">Sends</text>
<text class="v" x="148" y="418">your headers, cookies that match api.example.com</text>
<text class="k" x="44" y="446">Drops</text>
<text class="v" x="148" y="446">Authorization, because the hostname changed</text>

<text class="dim" x="24" y="502">Cypress records each hop in response.redirects and response.allRequestResponses.</text>
</svg>
