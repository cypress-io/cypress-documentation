<svg xmlns="http://www.w3.org/2000/svg" width="720" height="392" viewBox="0 0 720 392" role="img" aria-labelledby="t d">
<title id="t">What cy.request() sends at each redirect</title>
<desc id="d">A POST to http://localhost:8080/login with your headers, an Authorization header, a Content-Type header, and a body returns 302 with a Set-Cookie header, which Cypress saves in the browser. Cypress follows it with a GET to http://localhost:8080/home that keeps your headers and Authorization, adds the saved cookie, and drops the body, Content-Type, and Content-Length. That returns 302 to https://api.example.com/me, a different hostname, so the next GET keeps your headers but drops Authorization too, and sends only cookies that match api.example.com. A 307 redirect keeps the method, body, and Content-Type.</desc>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#555a6e"/>
  </marker>
</defs>
<style>
  .card { fill: #f7f8fc; stroke: #e1e3ed; }
  .box { fill: #ffffff; stroke: #6f74a0; stroke-width: 1.25; }
  .line { fill: none; stroke: #555a6e; stroke-width: 1.5; }
  .num { font: 600 13px -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #555a6e; }
  .req { font: 600 14px ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; fill: #1b1e2e; }
  .k { font: 600 13px -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #1b1e2e; }
  .drop { font: 600 13px -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #b4232a; }
  .v { font: 13px -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #1b1e2e; }
  .resp { font: 600 12.5px ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; fill: #1b1e2e; }
  .side { font: italic 13px -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #555a6e; }
</style>
<rect class="card" x="0.5" y="0.5" width="719" height="391" rx="12"/>

<!-- Request 1 -->
<rect class="box" x="20" y="20" width="680" height="62" rx="8"/>
<text class="num" x="36" y="44">Request 1</text>
<text class="req" x="120" y="44">POST http://localhost:8080/login</text>
<text class="k" x="36" y="68">Sends</text>
<text class="v" x="120" y="68">your headers, Authorization, Content-Type, body</text>

<path class="line" d="M 60 84 V 114" marker-end="url(#arr)"/>
<text class="resp" x="76" y="104">302 · Location: /home · Set-Cookie: sid=…</text>
<text class="side" x="700" y="104" text-anchor="end">Cypress saves sid in the browser</text>

<!-- Request 2 -->
<rect class="box" x="20" y="118" width="680" height="100" rx="8"/>
<text class="num" x="36" y="142">Request 2</text>
<text class="req" x="120" y="142">GET http://localhost:8080/home</text>
<text class="k" x="36" y="166">Sends</text>
<text class="v" x="120" y="166">your headers, Authorization, Cookie: sid=…</text>
<text class="drop" x="36" y="190">Drops</text>
<text class="v" x="120" y="190">body, Content-Type, Content-Length</text>
<text class="side" x="120" y="208">The method becomes GET. Only a 307 keeps the method, body, and Content-Type.</text>

<path class="line" d="M 60 220 V 250" marker-end="url(#arr)"/>
<text class="resp" x="76" y="240">302 · Location: https://api.example.com/me</text>
<text class="side" x="700" y="240" text-anchor="end">a different hostname</text>

<!-- Request 3 -->
<rect class="box" x="20" y="254" width="680" height="84" rx="8"/>
<text class="num" x="36" y="278">Request 3</text>
<text class="req" x="120" y="278">GET https://api.example.com/me</text>
<text class="k" x="36" y="302">Sends</text>
<text class="v" x="120" y="302">your headers, cookies that match api.example.com</text>
<text class="drop" x="36" y="326">Drops</text>
<text class="v" x="120" y="326">Authorization, because the hostname changed</text>

<text class="side" x="20" y="370">Cypress records each hop in response.redirects and response.allRequestResponses.</text>
</svg>
