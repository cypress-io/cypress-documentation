<svg xmlns="http://www.w3.org/2000/svg" width="760" height="542" viewBox="0 0 760 542" role="img" aria-labelledby="t d">
<title id="t">Parts of a URL that Cypress reads</title>
<desc id="d">Two URLs split into the parts that Cypress reads. A standard URL, https://example.com:8080/app/users?tab=1#section: protocol is https:, hostname is example.com, port is 8080, host is example.com:8080, origin is https://example.com:8080, pathname is /app/users, search is ?tab=1, hash is #section, and href is the whole URL. A hash-based route, https://example.com/app/#/users/1?tab=profile: pathname is /app/ and hash is #/users/1?tab=profile. The question mark is inside the hash, so search is an empty string. cy.url() yields href, cy.hash() yields hash, and cy.location(key) yields the part named by key.</desc>
<style>
  .card { fill: #f7f8fc; stroke: #e1e3ed; }
  .rule { stroke: #e1e3ed; stroke-width: 1; }
  .heading { font: 600 14px -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #555a6e; }
  .u, .u-dim, .u-hash { font: 500 19px ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; }
  .u { fill: #1b1e2e; }
  .u-dim { fill: #8a8ea3; }
  .u-hash { fill: #4956e3; }
  .hl { fill: #e3e6fb; }
  .br { fill: none; stroke: #6f74a0; stroke-width: 1.25; }
  .callout { fill: none; stroke: #555a6e; stroke-width: 1.25; }
  .key { font: 600 13px ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; fill: #1b1e2e; }
  .key-hash { font: 600 13px ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; fill: #4956e3; }
  .cmd { font: 600 14px ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; fill: #1b1e2e; }
  .key-inline { font: 600 13px ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; fill: #1b1e2e; }
  .note { font: 13px -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #555a6e; }
</style>
<rect class="card" x="0.5" y="0.5" width="759" height="541" rx="12"/>
<text class="heading" x="32" y="42">A standard URL</text>
<text class="u" x="92" y="160" textLength="72" lengthAdjust="spacingAndGlyphs">https:</text>
<text class="u-dim" x="164" y="160" textLength="24" lengthAdjust="spacingAndGlyphs">//</text>
<text class="u" x="188" y="160" textLength="132" lengthAdjust="spacingAndGlyphs">example.com</text>
<text class="u-dim" x="320" y="160" textLength="12" lengthAdjust="spacingAndGlyphs">:</text>
<text class="u" x="332" y="160" textLength="48" lengthAdjust="spacingAndGlyphs">8080</text>
<text class="u" x="380" y="160" textLength="120" lengthAdjust="spacingAndGlyphs">/app/users</text>
<text class="u" x="500" y="160" textLength="72" lengthAdjust="spacingAndGlyphs">?tab=1</text>
<text class="u-hash" x="572" y="160" textLength="96" lengthAdjust="spacingAndGlyphs">#section</text>
<path class="br" d="M 189.5 138 V 131 H 378.5 V 138"/>
<text class="key" x="284.0" y="124" text-anchor="middle">host</text>
<path class="br" d="M 93.5 100 V 93 H 378.5 V 100"/>
<text class="key" x="236.0" y="86" text-anchor="middle">origin</text>
<path class="br" d="M 93.5 170 V 177 H 162.5 V 170"/>
<text class="key" x="128.0" y="194" text-anchor="middle">protocol</text>
<path class="br" d="M 189.5 170 V 177 H 318.5 V 170"/>
<text class="key" x="254.0" y="194" text-anchor="middle">hostname</text>
<path class="br" d="M 333.5 170 V 177 H 378.5 V 170"/>
<text class="key" x="356.0" y="194" text-anchor="middle">port</text>
<path class="br" d="M 381.5 170 V 177 H 498.5 V 170"/>
<text class="key" x="440.0" y="194" text-anchor="middle">pathname</text>
<path class="br" d="M 501.5 170 V 177 H 570.5 V 170"/>
<text class="key" x="536.0" y="194" text-anchor="middle">search</text>
<path class="br" d="M 573.5 170 V 177 H 666.5 V 170"/>
<text class="key-hash" x="620.0" y="194" text-anchor="middle">hash</text>
<path class="br" d="M 93.5 212 V 219 H 666.5 V 212"/>
<text class="key" x="380.0" y="236" text-anchor="middle">href</text>
<line class="rule" x1="32" x2="728" y1="268" y2="268"/>
<text class="heading" x="32" y="302">A hash-based route</text>
<rect class="hl" x="488" y="341" width="144" height="26" rx="4"/>
<text class="u" x="92" y="360" textLength="72" lengthAdjust="spacingAndGlyphs">https:</text>
<text class="u-dim" x="164" y="360" textLength="24" lengthAdjust="spacingAndGlyphs">//</text>
<text class="u" x="188" y="360" textLength="132" lengthAdjust="spacingAndGlyphs">example.com</text>
<text class="u" x="320" y="360" textLength="60" lengthAdjust="spacingAndGlyphs">/app/</text>
<text class="u-hash" x="380" y="360" textLength="108" lengthAdjust="spacingAndGlyphs">#/users/1</text>
<text class="u-hash" x="488" y="360" textLength="144" lengthAdjust="spacingAndGlyphs">?tab=profile</text>
<path class="br" d="M 321.5 370 V 377 H 378.5 V 370"/>
<text class="key" x="350.0" y="394" text-anchor="middle">pathname</text>
<path class="br" d="M 381.5 370 V 377 H 630.5 V 370"/>
<text class="key-hash" x="506.0" y="394" text-anchor="middle">hash</text>
<path class="callout" d="M 494.0 339 V 322 H 478.0"/>
<text class="note" x="472.0" y="326" text-anchor="end">This ? is part of the hash, so search is an empty string</text>
<line class="rule" x1="32" x2="728" y1="428" y2="428"/>
<text class="cmd" x="32" y="460">cy.url()</text>
<text class="note" x="190" y="460">yields <tspan class="key-inline">href</tspan></text>
<text class="cmd" x="32" y="486">cy.hash()</text>
<text class="note" x="190" y="486">yields <tspan class="key-inline">hash</tspan>, the same value as <tspan class="key-inline">cy.location('hash')</tspan></text>
<text class="cmd" x="32" y="512">cy.location(key)</text>
<text class="note" x="190" y="512">yields the part named by <tspan class="key-inline">key</tspan>; with no key, an object holding every part</text>
</svg>
