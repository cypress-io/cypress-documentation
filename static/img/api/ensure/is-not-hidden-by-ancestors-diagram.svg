<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-labelledby="t d">
<title id="t">What Cypress.ensure.isNotHiddenByAncestors() checks</title>
<desc id="d">Two panels. On the left, a #carousel container with overflow: hidden shows Slide 1 inside its visible area, which passes, while Slide 2 sits outside the visible area and is clipped by the container's overflow, which fails. On the right, an input inside a section with display: none passes isNotHiddenByAncestors(), because the check doesn't look at an ancestor's display, while isVisible() fails for it.</desc>
<style>
  .card { fill: #f7f8fc; stroke: #e1e3ed; }
  .content { fill: #eef0fb; stroke: #6f74a0; stroke-width: 1.25; stroke-dasharray: 4 4; }
  .item { fill: #ffffff; stroke: #6f74a0; stroke-width: 1; }
  .view { fill: none; stroke: #4956e3; stroke-width: 3; }
  .heading { font: 600 15px -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #1b1e2e; }
  .label { font: 13px ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; fill: #1b1e2e; }
  .note { font: 13px -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #555a6e; }
  .pass { font: 600 13px -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #1a6b34; }
  .fail { font: 600 13px -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #b3261e; }
  .passmono { font: 600 13px ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; fill: #1a6b34; }
  .failmono { font: 600 13px ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; fill: #b3261e; }
</style>
<rect class="card" x="0.5" y="0.5" width="759" height="299" rx="12"/>

<!-- headings: what fails the check, then what it doesn't look at -->
<text class="heading" x="225" y="44" text-anchor="middle">Clipped by an ancestor's overflow</text>
<text class="note" x="225" y="68" text-anchor="middle">isNotHiddenByAncestors() fails the clipped slide</text>
<text class="heading" x="608" y="44" text-anchor="middle">Inside a display: none parent</text>
<text class="note" x="608" y="68" text-anchor="middle">Not this check: use isVisible()</text>

<!-- divider -->
<path d="M458 24 V276" stroke="#e1e3ed" stroke-width="1"/>

<!-- left panel: the carousel -->
<text class="label" x="62" y="108">#carousel { overflow: hidden }</text>
<!-- the scrolled content, most of it outside the container -->
<rect class="content" x="62" y="122" width="320" height="70"/>
<rect class="item" x="72" y="132" width="132" height="50"/>
<text class="label" x="138" y="162" text-anchor="middle">Slide 1</text>
<rect class="item" x="240" y="132" width="132" height="50"/>
<text class="label" x="306" y="162" text-anchor="middle">Slide 2</text>
<!-- the container's visible area -->
<rect class="view" x="62" y="122" width="152" height="70"/>
<text class="pass" x="138" y="222" text-anchor="middle">✓ passes</text>
<text class="note" x="138" y="242" text-anchor="middle">inside the visible area</text>
<text class="fail" x="306" y="222" text-anchor="middle">✗ fails</text>
<text class="note" x="306" y="242" text-anchor="middle">clipped by the overflow</text>

<!-- right panel: hidden parent -->
<text class="label" x="503" y="108">&lt;section style="display: none"&gt;</text>
<rect class="content" x="503" y="122" width="210" height="70"/>
<rect class="item" x="523" y="137" width="170" height="40"/>
<text class="label" x="608" y="162" text-anchor="middle">&lt;input&gt;</text>
<text x="608" y="222" text-anchor="middle"><tspan class="pass">✓ </tspan><tspan class="passmono">isNotHiddenByAncestors()</tspan><tspan class="pass"> passes</tspan></text>
<text x="608" y="244" text-anchor="middle"><tspan class="fail">✗ </tspan><tspan class="failmono">isVisible()</tspan><tspan class="fail"> fails</tspan></text>
</svg>
