<svg xmlns="http://www.w3.org/2000/svg" width="760" height="414" viewBox="0 0 760 414" role="img" aria-labelledby="t d">
<title id="t">How .scrollTo() and .scrollIntoView() scroll the same list</title>
<desc id="d">Two panels show the same scrollable #feed list of eight items. On the left, .scrollTo('bottom') targets the container and moves the visible area to the bottom of the list, showing items 6 to 8. On the right, .scrollIntoView() targets item 5 and moves the visible area until item 5 sits at its top, showing items 5 to 7.</desc>
<style>
  .card { fill: #f7f8fc; stroke: #e1e3ed; }
  .content { fill: #eef0fb; stroke: #6f74a0; stroke-width: 1.25; stroke-dasharray: 4 4; }
  .item { fill: #ffffff; stroke: #6f74a0; stroke-width: 1; }
  .target { fill: #ffffff; stroke: #1b1e2e; stroke-width: 2.5; }
  .view { fill: none; stroke: #4956e3; stroke-width: 3; }
  .arrow { stroke: #1b1e2e; stroke-width: 2; fill: none; }
  .head { fill: #1b1e2e; }
  .code { font: 600 15px ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; fill: #1b1e2e; }
  .label { font: 13px ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; fill: #1b1e2e; }
  .note { font: 13px -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #555a6e; }
  .callout { font: 600 13px -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #1b1e2e; }
</style>
<rect class="card" x="0.5" y="0.5" width="759" height="413" rx="12"/>

<!-- headings: the calls from the page example, then what each does -->
<text class="code" x="190" y="44" text-anchor="middle">cy.get('#feed').scrollTo('bottom')</text>
<text class="note" x="190" y="68" text-anchor="middle">Scrolls #feed to its bottom</text>
<text class="code" x="570" y="44" text-anchor="middle">cy.get('#item-5').scrollIntoView()</text>
<text class="note" x="570" y="68" text-anchor="middle">Scrolls until Item 5 is at the top</text>

<!-- divider -->
<path d="M380 24 V358" stroke="#e1e3ed" stroke-width="1"/>

<g transform="translate(30 -8)">
<!-- left panel: .scrollTo('bottom') -->
<rect class="content" x="90" y="98" width="140" height="256"/>
<rect class="item" x="98" y="102" width="124" height="24"/><text class="label" x="110" y="119">Item 1</text>
<rect class="item" x="98" y="134" width="124" height="24"/><text class="label" x="110" y="151">Item 2</text>
<rect class="item" x="98" y="166" width="124" height="24"/><text class="label" x="110" y="183">Item 3</text>
<rect class="item" x="98" y="198" width="124" height="24"/><text class="label" x="110" y="215">Item 4</text>
<rect class="item" x="98" y="230" width="124" height="24"/><text class="label" x="110" y="247">Item 5</text>
<rect class="item" x="98" y="262" width="124" height="24"/><text class="label" x="110" y="279">Item 6</text>
<rect class="item" x="98" y="294" width="124" height="24"/><text class="label" x="110" y="311">Item 7</text>
<rect class="item" x="98" y="326" width="124" height="24"/><text class="label" x="110" y="343">Item 8</text>
<rect class="view" x="88" y="258" width="144" height="98"/>
<!-- arrow at the container -->
<path class="arrow" d="M300 140 H240"/>
<path class="head" d="M232 140 L244 134 L244 146 Z"/>
<text class="callout" x="246" y="112">targets the</text>
<text class="callout" x="246" y="128">container</text>

<!-- right panel: .scrollIntoView() -->
<rect class="content" x="470" y="98" width="140" height="256"/>
<rect class="item" x="478" y="102" width="124" height="24"/><text class="label" x="490" y="119">Item 1</text>
<rect class="item" x="478" y="134" width="124" height="24"/><text class="label" x="490" y="151">Item 2</text>
<rect class="item" x="478" y="166" width="124" height="24"/><text class="label" x="490" y="183">Item 3</text>
<rect class="item" x="478" y="198" width="124" height="24"/><text class="label" x="490" y="215">Item 4</text>
<rect class="target" x="478" y="230" width="124" height="24"/><text class="label" x="490" y="247">Item 5</text>
<rect class="item" x="478" y="262" width="124" height="24"/><text class="label" x="490" y="279">Item 6</text>
<rect class="item" x="478" y="294" width="124" height="24"/><text class="label" x="490" y="311">Item 7</text>
<rect class="item" x="478" y="326" width="124" height="24"/><text class="label" x="490" y="343">Item 8</text>
<rect class="view" x="468" y="226" width="144" height="98"/>
<!-- arrow at the item -->
<path class="arrow" d="M680 242 H620"/>
<path class="head" d="M612 242 L624 236 L624 248 Z"/>
<text class="callout" x="626" y="214">targets</text>
<text class="callout" x="626" y="230">the item</text>
</g>

<!-- legend -->
<rect class="content" x="150" y="374" width="26" height="16"/>
<text class="note" x="184" y="387">scrollable content</text>
<rect class="view" x="320" y="374" width="26" height="16"/>
<text class="note" x="354" y="387">visible area after the scroll</text>
</svg>
