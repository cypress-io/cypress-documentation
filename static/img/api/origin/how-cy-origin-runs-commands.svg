<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440" role="img" aria-labelledby="t d">
<title id="t">How cy.origin() runs commands in another origin</title>
<desc id="d">Your test runs in the primary origin, https://app.cypress.io. When it reaches cy.origin(), it sends the callback as text, plus the args option serialized, to a separate copy of Cypress running in the secondary origin, https://auth.cypress.io. That copy runs the callback's commands against the page under test at https://auth.cypress.io, then sends the yielded value back to your test, serialized. Variables declared outside the callback, cy.intercept(), and cy.session() stay in your test. The copy of Cypress in the secondary origin stays loaded until the spec file ends.</desc>
<style>
  .card { fill: #f7f8fc; stroke: #e1e3ed; }
  .box { fill: #ffffff; stroke: #4956e3; stroke-width: 2; }
  .page { fill: #eef0fb; stroke: #4956e3; stroke-width: 2; }
  .note { fill: #ffffff; stroke: #6f74a0; stroke-width: 1.25; stroke-dasharray: 4 4; }
  .arrow { stroke: #4956e3; stroke-width: 2; fill: none; }
  .head { fill: #4956e3; }
  .h { font: 600 16px -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #1b1e2e; }
  .b { font: 14px -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #1b1e2e; }
  .m { font: 13px -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #555a6e; }
  .code { font: 13px ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; fill: #1b1e2e; }
  .codem { font: 13px ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; fill: #555a6e; }
  .lbl { font: 600 13px -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #3a44c4; }
</style>
<rect class="card" x="0.5" y="0.5" width="759" height="439" rx="12"/>

<!-- Origin labels -->
<text class="m" x="30" y="40">Primary origin</text>
<text class="codem" x="30" y="58">https://app.cypress.io</text>
<text class="m" x="450" y="40">Secondary origin</text>
<text class="codem" x="450" y="58">https://auth.cypress.io</text>

<!-- Your test -->
<rect class="box" x="30" y="72" width="280" height="140" rx="10"/>
<text class="h" x="50" y="104">Your test</text>
<text class="b" x="50" y="132">Runs every command outside</text>
<text class="b" x="50" y="152">the <tspan class="code">cy.origin()</tspan> callback</text>

<!-- Cypress in the secondary origin -->
<rect class="box" x="450" y="72" width="280" height="140" rx="10"/>
<text class="h" x="470" y="104">Cypress in the secondary origin</text>
<text class="b" x="470" y="132">Runs the callback's commands</text>
<text class="b" x="470" y="152">Stays loaded until the spec</text>
<text class="b" x="470" y="172">file ends</text>

<!-- 1. Callback and args go over -->
<text class="lbl" x="380" y="100" text-anchor="middle">callback as text</text>
<text class="lbl" x="380" y="117" text-anchor="middle">+ args, serialized</text>
<line class="arrow" x1="314" y1="130" x2="438" y2="130"/>
<polygon class="head" points="446,130 436,124 436,136"/>

<!-- 2. Yielded value comes back -->
<line class="arrow" x1="446" y1="166" x2="322" y2="166"/>
<polygon class="head" points="314,166 324,160 324,172"/>
<text class="lbl" x="380" y="190" text-anchor="middle">yielded value,</text>
<text class="lbl" x="380" y="207" text-anchor="middle">serialized</text>

<!-- 3. Commands run against the page -->
<line class="arrow" x1="590" y1="216" x2="590" y2="270"/>
<polygon class="head" points="590,278 584,268 596,268"/>
<text class="lbl" x="602" y="252">runs commands</text>

<!-- The page under test -->
<rect class="page" x="450" y="282" width="280" height="84" rx="10"/>
<text class="h" x="470" y="314">The page under test</text>
<text class="code" x="470" y="342">https://auth.cypress.io/login</text>

<!-- What stays in your test -->
<rect class="note" x="30" y="282" width="280" height="128" rx="10"/>
<text class="h" x="50" y="314">Stays in your test</text>
<text class="b" x="50" y="342">• Variables declared outside</text>
<text class="b" x="62" y="362">the callback</text>
<text class="b" x="50" y="388">• <tspan class="code">cy.intercept()</tspan> and <tspan class="code">cy.session()</tspan></text>
</svg>
