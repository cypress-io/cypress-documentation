<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" width="820" height="300" role="img" aria-labelledby="title">
<title id="title">How cy.mount() is registered and called</title>
<style>
  .t{font-family:Inter,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#0f172a}
  .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;fill:#0f172a}
  .h{font-size:15px;font-weight:700}
  .b{font-size:14px;font-weight:600}
  .s{font-size:13.5px;fill:#334155}
  .c{font-size:13.5px}
  .err{fill:#b91c1c}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
<rect width="820" height="300" rx="10" fill="#f8fafc"/>
<text class="t h" x="20" y="30">1. Before each spec, the support file registers cy.mount()</text>
<rect x="20" y="44" width="240" height="78" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text class="t b" x="140" y="68" text-anchor="middle">Built-in placeholder</text>
<text class="t s" x="140" y="89" text-anchor="middle">throws until you register one:</text>
<text class="m err" font-size="12" x="140" y="108" text-anchor="middle">must be implemented by the user</text>
<line x1="262" y1="83" x2="286" y2="83" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="290" y="44" width="240" height="78" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4"/>
<text class="m b" x="410" y="68" text-anchor="middle">support/commands.js</text>
<text class="t s" x="410" y="89" text-anchor="middle">optional, imported first</text>
<text class="m c" x="410" y="108" text-anchor="middle">Commands.add('mount', …)</text>
<line x1="532" y1="83" x2="556" y2="83" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="560" y="44" width="240" height="78" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
<text class="m b" x="680" y="68" text-anchor="middle">support/component.js</text>
<text class="t s" x="680" y="89" text-anchor="middle">runs last, so it wins</text>
<text class="m c" x="680" y="108" text-anchor="middle">Commands.add('mount', …)</text>
<text class="t s" x="20" y="146">Each registration replaces the one before it, without an error.</text>
<line x1="20" y1="164" x2="800" y2="164" stroke="#cbd5e1"/>
<text class="t h" x="20" y="192">2. In your test, cy.mount() runs the command you registered</text>
<rect x="20" y="206" width="174" height="74" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<text class="t b" x="107" y="233" text-anchor="middle">Your spec</text>
<text class="m c" style="font-size:12.5px" x="107" y="256" text-anchor="middle">cy.mount(&lt;Stepper /&gt;)</text>
<line x1="196" y1="243" x2="218" y2="243" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="222" y="206" width="174" height="74" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<text class="t b" x="309" y="233" text-anchor="middle">Your command</text>
<text class="t s" x="309" y="256" text-anchor="middle">wraps, sets defaults</text>
<line x1="398" y1="243" x2="420" y2="243" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="424" y="206" width="174" height="74" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<text class="t b" x="511" y="233" text-anchor="middle">Framework mount()</text>
<text class="m c" x="511" y="256" text-anchor="middle">cypress/react, …</text>
<line x1="600" y1="243" x2="622" y2="243" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="626" y="206" width="174" height="74" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<text class="t b" x="713" y="233" text-anchor="middle">Renders into</text>
<text class="m c" x="713" y="256" text-anchor="middle">[data-cy-root]</text>
</svg>
