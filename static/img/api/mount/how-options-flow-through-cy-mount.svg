<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" width="780" height="420" role="img" aria-labelledby="title">
<title id="title">How options flow through a custom cy.mount() command</title>
<style>
  .t{font-family:Inter,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#0f172a}
  .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;fill:#0f172a}
  .h{font-size:15px;font-weight:700}
  .b{font-size:14px;font-weight:600}
  .s{font-size:13.5px;fill:#334155}
  .c{font-size:13.5px}
  .err{fill:#b91c1c}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
<rect width="780" height="420" rx="10" fill="#f8fafc"/>
<rect x="140" y="20" width="500" height="58" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<text class="t s" x="390" y="42" text-anchor="middle">Your test passes both options</text>
<text class="m c" x="390" y="63" text-anchor="middle">cy.mount(&lt;Toolbar /&gt;, { theme: 'dark', log: false })</text>
<line x1="390" y1="80" x2="390" y2="104" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="140" y="108" width="500" height="58" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
<text class="t s" x="390" y="130" text-anchor="middle">Your command takes out its own option</text>
<text class="m c" x="390" y="151" text-anchor="middle">const { theme = 'light', ...mountOptions } = options</text>
<path d="M300 168 L300 186 L205 186 L205 204" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M480 168 L480 186 L575 186 L575 204" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="40" y="208" width="330" height="62" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
<text class="m c" x="205" y="232" text-anchor="middle">theme: 'dark'</text>
<text class="m c" x="205" y="254" text-anchor="middle">&lt;ThemeContext.Provider value="dark"&gt;</text>
<rect x="410" y="208" width="330" height="62" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
<text class="m c" x="575" y="232" text-anchor="middle">mountOptions: { log: false }</text>
<text class="m c" x="575" y="254" text-anchor="middle">mount(…, mountOptions)</text>
<line x1="20" y1="292" x2="760" y2="292" stroke="#cbd5e1"/>
<text class="t h" x="20" y="320">Where you spread options decides which value wins</text>
<rect x="40" y="336" width="330" height="64" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
<text class="m c" x="205" y="361" text-anchor="middle">{ strict: true, ...options }</text>
<text class="t s" x="205" y="384" text-anchor="middle">default: a test can pass strict: false</text>
<rect x="410" y="336" width="330" height="64" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text class="m c" x="575" y="361" text-anchor="middle">{ ...options, strict: true }</text>
<text class="t s" x="575" y="384" text-anchor="middle">forced: the command's value always wins</text>
</svg>
